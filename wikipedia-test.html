<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>LUNO — בדיקת קישור חיצוני</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c0c; color: #f6f4ef; font-family: Arial, sans-serif; padding: 24px; }
    main { width: 100%; max-width: 480px; text-align: center; }
    .brand { font-size: 28px; letter-spacing: 8px; }
    h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.4; margin: 36px 0 16px; }
    p { font-size: 20px; line-height: 1.6; color: #c8c8c8; }
    a { display: block; padding: 22px 16px; margin-top: 32px; background: #f6f4ef; color: #0b0c0c; border-radius: 12px; text-decoration: none; font-size: 24px; font-weight: bold; }
    a:focus-visible { outline: 3px solid #aaa; outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="brand" dir="ltr">LUNO</div>
    <h1>בדיקת יציאה לאתר חיצוני</h1>
    <p>לחצו על הכפתור כדי לפתוח את ויקיפדיה.</p>
    <a href="https://he.wikipedia.org">פתח ויקיפדיה</a>
  </main>
</body>
</html>
